[project]
name = "excel-co-pilot"
version = "0.1.0"
description = "Excel Co-Pilot：本地优先的 AI 数据分析智能体（LangGraph + Gradio）"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=0.5",
    "fastapi>=0.141.1",
    "gradio>=6.24.0",
    "jieba>=0.42",
    "loguru>=0.7.3",
    "numpy>=2.5.2",
    "openai>=2.54.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pdfplumber>=0.11.10",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "PyMuPDF>=1.23",
    "python-docx>=1.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0",
    "rank-bm25>=0.2",
    "requests>=2.31.0",
    "uvicorn[standard]>=0.52.2",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14",
]

[project.scripts]
excel-co-pilot = "excel_co_pilot.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
ignore = [
    "BLE001",  # 容错场景（单条失败跳过继续）有意捕获盲异常
    "S110",    # try/except/pass 为"尽力而为"容错
]

[tool.ruff.lint.per-file-ignores]
"src/excel_co_pilot/main.py" = ["B008"]  # FastAPI 标准写法
